version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel_app
    working_dir: /var/www
    volumes:
      - ../src:/var/www:delegated
      # Windows: mount session vào tmpfs để tránh permission lỗi
      # - type: tmpfs
      #   target: /var/www/storage/framework/sessions
      # Comment dong nay va dong tren khi su dung ubuntu
      
      # Nên để container tự install vendor, tránh mount trực tiếp
      # - ../src/vendor:/var/www/vendor
      - ./php/php.ini:/usr/local/etc/php/conf.d/custom.ini
      - ./entrypoint.sh:/var/www/entrypoint.sh # mount entrypoint
    networks:
      - laravel
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
    # Chạy container với UID/GID host (fix triệt để permission)
    entrypoint: ["/var/www/entrypoint.sh"]
    command: ["php-fpm"]

  web:
    image: nginx:alpine
    container_name: laravel_web
    ports:
      - "8080:80"
    volumes:
      - ../src:/var/www:delegated
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - laravel

  db:
    image: mysql:8.0
    container_name: laravel_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - laravel

  redis:
    image: redis:alpine
    container_name: laravel_redis
    ports:
      - "6379:6379"
    networks:
      - laravel

  mailpit:
    image: axllent/mailpit
    container_name: laravel_mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - laravel
  
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: laravel_phpmyadmin
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "8081:80"
    depends_on:
      - db
    networks:
      - laravel

networks:
  laravel:

volumes:
  db_data:
