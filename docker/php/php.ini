; Giới hạn bộ nhớ tối đa
memory_limit = 1024M

; Giới hạn file upload tối đa
upload_max_filesize = 200M

; Giới hạn tổng dữ liệu POST
post_max_size = 200M

; Thời gian chạy script tối đa (giúp upload lớn không bị timeout)
max_execution_time = 600
max_input_time = 600
xdebug.client_host=host.docker.internal
