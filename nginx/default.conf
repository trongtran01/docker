server {
    listen 80;
    server_name localhost;
    root /var/www/public;
    index index.php index.html;

    client_max_body_size 200M;

    # ============================================================================
    # FIX CHO WINDOWS/WSL: Serve storage files trực tiếp từ thư mục gốc
    # ============================================================================
    # Vấn đề: Symlink /var/www/public/storage -> /var/www/storage/app/public
    #         không hoạt động tốt trên Windows/WSL với Docker volumes
    # 
    # Giải pháp: Nginx sẽ serve trực tiếp từ /var/www/storage/app/public
    #            thay vì đi qua symlink /var/www/public/storage
    # ============================================================================
    
    # QUAN TRỌNG: Block này PHẢI ĐẶT TRƯỚC location ~ \.php$ để ưu tiên xử lý
    location ^~ /storage/ {
        # alias: trỏ trực tiếp đến thư mục storage thực tế
        # CHÚ Ý: alias phải kết thúc bằng / nếu location kết thúc bằng /
        alias /var/www/storage/app/public/;
        
        # Tối ưu performance: cache ảnh 30 ngày
        expires 30d;
        add_header Cache-Control "public, immutable";
        
        # Tắt access log cho static files (giảm I/O)
        access_log off;
        
        # Tắt log 404 cho files không tồn tại
        log_not_found off;
        
        # Cho phép CORS nếu cần (uncomment nếu frontend ở domain khác)
        # add_header Access-Control-Allow-Origin *;
        
        # Security: chặn các file nguy hiểm như .php, .sh, .exe
        location ~ \.(php|phtml|sh|exe|bat)$ {
            deny all;
        }
        
        # Auto index nếu muốn xem danh sách file (chỉ dùng khi debug)
        # autoindex on;
    }

    # ============================================================================
    # Laravel front controller - Xử lý tất cả routes của Laravel
    # ============================================================================
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ============================================================================
    # PHP-FPM Configuration - Xử lý các file PHP
    # ============================================================================
    location ~ \.php$ {
        # Gửi request đến PHP-FPM container (service name: app, port: 9000)
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        
        # Đường dẫn file PHP thực tế trên server
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        
        # Tách đường dẫn PHP và PATH_INFO (cần cho một số framework)
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        
        # Document root cho PHP-FPM
        fastcgi_param DOCUMENT_ROOT $document_root;
        
        # Tăng timeout cho các request xử lý lâu (upload file lớn, import data...)
        fastcgi_read_timeout 300s;
        fastcgi_send_timeout 300s;
        
        # Buffer settings (tối ưu cho file lớn)
        fastcgi_buffer_size 128k;
        fastcgi_buffers 256 16k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;
    }

    # ============================================================================
    # Security: Chặn truy cập các file/folder ẩn (.git, .env, .htaccess...)
    # ============================================================================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ============================================================================
    # (Optional) Chặn truy cập trực tiếp vào các file nhạy cảm
    # ============================================================================
    location ~ /(composer\.json|composer\.lock|package\.json|yarn\.lock|\.env.*) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ============================================================================
    # (Optional) Tối ưu cho static assets (CSS, JS, fonts, images trong public/)
    # ============================================================================
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}